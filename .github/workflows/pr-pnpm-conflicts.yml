name: PR PNPM Conflicts

on:
  workflow_dispatch:
    inputs:
      ref_value:
        description: 'PR number (branch must be in this repository)'
        required: true
        type: string

permissions: {}

jobs:
  fix-pnpm-lock:
    name: 'Fix pnpm lock conflicts and commit changes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Determine checkout reference
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected a pull request number."
            exit 1
          fi

          PR_INFO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg id "$REPOSITORY_ID" '.head.repo.id == ($id | tonumber)' <<< "$PR_INFO" > /dev/null; then
            echo "::error::Maintenance requires a pull request branch in this repository."
            exit 1
          fi

          HEAD_SHA=$(jq -er '.head.sha | select(test("\\A[0-9a-f]{40}\\z"))' <<< "$PR_INFO")
          HEAD_REF="refs/heads/$(jq -er '.head.ref | strings | select(length > 0)' <<< "$PR_INFO")"
          git check-ref-format "$HEAD_REF"
          BASE_SHA=$(jq -er '.base.sha | select(test("\\A[0-9a-f]{40}\\z"))' <<< "$PR_INFO")
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Merge target commit into PR head
        env:
          BASE_SHA: ${{ steps.ref.outputs.base_sha }}
        run: |
          echo "Merging target commit $BASE_SHA into the PR head..."
          git cat-file -e "$BASE_SHA^{commit}"
          git merge --no-edit "$BASE_SHA" || true
          echo "Merge completed (conflicts expected and will be resolved by pnpm)"
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Using Node v26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: 'pnpm'
      - name: Check current branch info
        env:
          HEAD_REF: ${{ steps.ref.outputs.branch }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
          BASE_SHA: ${{ steps.ref.outputs.base_sha }}
        run: |
          echo "Requested PR: $PR_NUMBER"
          echo "Target branch: $HEAD_REF"
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Base commit: $BASE_SHA"
      - name: Regenerate pnpm-lock.yaml
        run: |
          echo "Regenerating pnpm-lock.yaml..."
          pnpm install --lockfile-only --ignore-scripts
      - name: Commit lock file changes
        env:
          HEAD_REF: ${{ steps.ref.outputs.branch }}
          HEAD_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            echo "Committing pnpm-lock.yaml changes..."
            git commit -m "🔒 Regenerate pnpm-lock.yaml to resolve conflicts

            Applied by GitHub Action workflow: $WORKFLOW_NAME
            Run ID: $RUN_ID
            Target PR: $PR_NUMBER"
            
            echo "Pushing changes..."
            # Publish only a descendant of the checked-out commit, and only if the branch is unchanged.
            git merge-base --is-ancestor "$HEAD_SHA" HEAD
            git push --force-with-lease="$HEAD_REF:$HEAD_SHA" origin "HEAD:$HEAD_REF"
          else
            echo "No changes to commit after regenerating lock file"
          fi
      - name: Output result
        run: |
          echo "✅ pnpm-lock.yaml has been regenerated and committed"
