name: Create Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - fast-check
          - ava
          - jest
          - vitest
          - worker
          - poisoning
          - packaged
      dry_run:
        description: 'Dry run (skip release creation)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-release:
    name: 'Create release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Extract changelog
        id: changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_DIR: ${{ github.event.inputs.package }}
        with:
          script: |
            const {extractLatestChangelog} = require('./.github/workflows/scripts/extract-changelog.cjs');
            const {version, tag, releaseName, changelog} = extractLatestChangelog(process.env.PACKAGE_DIR);
            console.log(`Version: ${version}`);
            console.log(`Tag: ${tag}`);
            console.log(`Release name: ${releaseName}`);
            console.log(`Changelog:\n${changelog}`);
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('release_name', releaseName);
            core.setOutput('changelog', changelog);
      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NAME: ${{ steps.changelog.outputs.release_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          MAKE_LATEST: "${{ github.event.inputs.package == 'fast-check' && 'true' || 'false' }}"
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if gh release view "$TAG" --json tagName > /dev/null 2>"$error_file"; then
            release_command=edit
            release_args=()
          elif grep -Fxq 'release not found' "$error_file"; then
            release_command=create
            release_args=(--draft)
          else
            cat "$error_file" >&2
            exit 1
          fi
          printf '%s' "$CHANGELOG" | gh release "$release_command" "$TAG" "${release_args[@]}" \
            --title "$RELEASE_NAME" --notes-file - --latest="$MAKE_LATEST"
      - name: Push tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
  announce-release:
    name: 'Announce release'
    needs: create-release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    uses: ./.github/workflows/announce-release-bluesky.yml
    with:
      tag: ${{ needs.create-release.outputs.tag }}
    secrets:
      BLUESKY_URL: ${{ secrets.BLUESKY_URL }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
