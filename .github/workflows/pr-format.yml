name: PR Format

on:
  workflow_dispatch:
    inputs:
      ref_value:
        description: 'PR number (branch must be in this repository)'
        required: true
        type: string

permissions: {}

jobs:
  format:
    name: 'Format code and commit changes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Determine checkout reference
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected a pull request number."
            exit 1
          fi

          PR_INFO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg id "$REPOSITORY_ID" '.head.repo.id == ($id | tonumber)' <<< "$PR_INFO" > /dev/null; then
            echo "::error::Maintenance requires a pull request branch in this repository."
            exit 1
          fi

          HEAD_SHA=$(jq -er '.head.sha | select(test("\\A[0-9a-f]{40}\\z"))' <<< "$PR_INFO")
          HEAD_REF="refs/heads/$(jq -er '.head.ref | strings | select(length > 0)' <<< "$PR_INFO")"
          git check-ref-format "$HEAD_REF"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Using Node v26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check current branch info
        env:
          HEAD_REF: ${{ steps.ref.outputs.branch }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
        run: |
          echo "Requested PR: $PR_NUMBER"
          echo "Target branch: $HEAD_REF"
          echo "Current commit: $(git rev-parse HEAD)"
      - name: Check if formatting is needed
        id: format_check
        run: |
          if ! pnpm format:check; then
            echo "changes_needed=true" >> $GITHUB_OUTPUT
          else
            echo "changes_needed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run format
        if: steps.format_check.outputs.changes_needed == 'true'
        run: pnpm format
      - name: Configure git
        if: steps.format_check.outputs.changes_needed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Commit formatting changes
        if: steps.format_check.outputs.changes_needed == 'true'
        env:
          HEAD_REF: ${{ steps.ref.outputs.branch }}
          HEAD_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.inputs.ref_value }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            echo "Committing formatting changes..."
            git commit -m "💄 Format code with prettier

            Applied by GitHub Action workflow: $WORKFLOW_NAME
            Run ID: $RUN_ID
            Target PR: $PR_NUMBER"
            
            echo "Pushing changes..."
            # Publish only a descendant of the checked-out commit, and only if the branch is unchanged.
            git merge-base --is-ancestor "$HEAD_SHA" HEAD
            git push --force-with-lease="$HEAD_REF:$HEAD_SHA" origin "HEAD:$HEAD_REF"
          else
            echo "No changes to commit after formatting"
          fi
      - name: Output result
        env:
          CHANGES_NEEDED: ${{ steps.format_check.outputs.changes_needed }}
        run: |
          if [ "$CHANGES_NEEDED" = "true" ]; then
            echo "✅ Formatting changes have been committed and pushed"
          else
            echo "✅ Code is already properly formatted, no changes needed"
          fi
